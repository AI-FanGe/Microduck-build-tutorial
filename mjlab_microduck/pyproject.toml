[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-microduck"
version = "0.1.0"
description = "Microduck RL environment for mjlab"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
  "mjlab==1.3.0",
  "warp-lang==1.12.0",
  "placo>=0.9.20",
  "better-actuator-models",
]

[project.entry-points."mjlab.tasks"]
mjlab_microduck = "mjlab_microduck.tasks"

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4
exclude = [
  "src/mjlab/third_party",
  "typings",
]

[tool.uv]
override-dependencies = [
  "protobuf>=4.0,<7.0",
  "onnx>=1.20.1",
  "zmq ; python_version < '3.0'",
]

[tool.uv.sources]
better-actuator-models = { git = "https://github.com/rhoban/bam.git", branch = "doc" }

